<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surya Namaskara Results</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5fff5; }
  h1 { text-align: center; margin-bottom: 20px; }
  .pose-card { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; padding: 8px; border-radius: 8px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .pose-name { font-weight: 700; font-size: 18px; }
  .progress-wrap { height: 25px; width: 100%; background: #eee; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; text-align: center; color: #fff; font-weight: 700; line-height: 25px; border-radius: 6px; transition: width 0.8s ease; }
  .pose-right { font-weight: 700; margin-top: 4px; }
  .suggestion { font-size: 14px; color: #444; margin-top: 4px; }
  .button-row { display: flex; justify-content: center; gap: 16px; margin: 20px 0; }
  .button-row button { padding: 8px 16px; border-radius: 8px; background: #4caf50; color: #fff; border: none; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>

<h1>Surya Namaskara Results</h1>
<div id="poseContainer"></div>

<div class="button-row">
  <button onclick="clearSession()">Clear</button>
  <button onclick="downloadReport()">Download PDF</button>
  <button onclick="location.href='surya.html'">Back</button>
</div>

<script>
function safeParse(v){ try{ return JSON.parse(v||'{}'); } catch(e){ return {}; } }
function clamp(v,a=0,b=100){ return Math.max(a,Math.min(b,v)); }
function colorFor(val){ if(val<40) return 'red'; if(val<80) return 'orange'; return 'green'; }

function loadResults(){
  const data = safeParse(sessionStorage.getItem('sessionResults'));
  const container = document.getElementById('poseContainer');
  container.innerHTML='';

  const poses = Object.keys(data||{});
  if(!poses.length){ container.innerHTML='<div>To Continue, click on Back</div>'; return; }

  poses.forEach(p=>{
    const entries = data[p];

    // Calculate average accuracy for pose
    let avg = 0;
    let suggestion = '';
    if(Array.isArray(entries)) {
      avg = Math.round(entries.reduce((s,e)=>s+(e.accuracy||0),0)/entries.length);
      // if backend sends feedback array, take first suggestion
      suggestion = entries[0]?.feedback || '';
    } else {
      avg = entries.accuracy || 0;
      suggestion = entries.feedback || '';
    }

    avg = clamp(avg);

    // Create pose card
    const card = document.createElement('div'); 
    card.className = 'pose-card';

    const nameEl = document.createElement('div'); 
    nameEl.className = 'pose-name'; 
    nameEl.textContent = p;
    card.appendChild(nameEl);

    const progWrap = document.createElement('div'); 
    progWrap.className = 'progress-wrap';
    const fill = document.createElement('div'); 
    fill.className = 'progress-fill'; 
    fill.style.width = '0%'; // animate from 0
    fill.style.background = colorFor(avg);
    fill.textContent = avg + '%';
    progWrap.appendChild(fill);
    card.appendChild(progWrap);

    // Animate width
    setTimeout(()=> fill.style.width = avg + '%', 50);

    // Suggestion / insight
    if(suggestion){
      const sugEl = document.createElement('div');
      sugEl.className = 'suggestion';
      sugEl.textContent = '💡 ' + suggestion;
      card.appendChild(sugEl);
    }

    container.appendChild(card);
  });
}

function downloadReport(){ html2pdf().from(document.body).save(); }
function clearSession(){ if(confirm('Clear session?')){ sessionStorage.removeItem('sessionResults'); location.reload(); } }

window.addEventListener('DOMContentLoaded', loadResults);
</script>

</body>
</html>
